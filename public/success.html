<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تمت العملية بنجاح | البنك الإسلامي العربي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#1B6B3A; --primary-deep:#145A2E;
  --bg:#f0eeeb; --surface:#fff; --ink:#1c1720; --muted:#888;
}
*{box-sizing:border-box; margin:0; padding:0}
body{font-family:"IBM Plex Sans Arabic","Cairo",sans-serif; background:var(--bg); min-height:100vh; display:flex; flex-direction:column}

.top-bar{display:flex; align-items:center; justify-content:center; padding:12px 16px}
.logo-area img{height:44px}

.success-container{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 24px; text-align:center}

.check-circle{width:90px; height:90px; border-radius:50%; background:var(--primary); display:flex; align-items:center; justify-content:center; margin-bottom:28px; animation:pop .4s ease}
.check-circle svg{width:48px; height:48px; color:#fff}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}

.success-title{font-size:1.5rem; font-weight:900; color:var(--ink); margin-bottom:12px}
.success-sub{font-size:1rem; color:var(--muted); line-height:1.8; max-width:340px; margin-bottom:32px}

.home-btn{width:100%; max-width:400px; height:56px; border:none; border-radius:28px; background:var(--primary); color:#fff; font-family:inherit; font-weight:900; font-size:1.15rem; cursor:pointer; transition:background .2s; text-decoration:none; display:flex; align-items:center; justify-content:center}
.home-btn:hover{background:var(--primary-deep)}
</style>
</head>
<body>

<div class="top-bar">
  <div class="logo-area">
    <img src="https://aib.ps/uc_files/image/resize/226/53/app_files/logopng_16691947964653877586094.png?vsig=fe3b85fa430300011345c623e9bc93d1" alt="AIB">
  </div>
</div>

<div class="success-container">
  <div class="check-circle">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
  </div>
  <div class="success-title">تمت العملية بنجاح</div>
  <div class="success-sub">تم تسجيل دخولك بنجاح. شكراً لاستخدامك خدمات البنك الإسلامي العربي.</div>
  <a class="home-btn" href="index.html">العودة للرئيسية</a>
</div>

</body>
</html>
